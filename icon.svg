<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="叶雪青主题">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F6F4"/>
      <stop offset="1" stop-color="#DCE8E2"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8C0B8"/>
      <stop offset="1" stop-color="#6F988A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4D2A4"/>
      <stop offset="1" stop-color="#C9A961"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- 云纹：如意云头，取自皮肤装饰动机 -->
  <g fill="none" stroke="url(#jade)" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M10 46c0-7 4.5-11 10-11s10 4 10 11"/>
    <path d="M20 46c0-3.5-1.8-5.5-4.5-5.5"/>
    <path d="M34 46c0-7 4.5-11 10-11s10 4 10 11"/>
    <path d="M44 46c0-3.5-1.8-5.5-4.5-5.5"/>
  </g>

  <!-- 立绘剪影：发髻 + 衣袂，极简 -->
  <g>
    <ellipse cx="32" cy="17" rx="6.5" ry="6" fill="#2E3A36"/>
    <circle cx="32" cy="10.5" r="2.6" fill="#2E3A36"/>
    <path d="M32 24c-6.5 0-11 4.6-11 11.5V42h22V35.5C43 28.6 38.5 24 32 24z" fill="url(#jade)"/>
    <path d="M32 24c-2.4 0-4.4 4-4.4 9V42h8.8V33c0-5-2-9-4.4-9z" fill="#FFFFFF" opacity="0.75"/>
    <!-- 腰带与金饰 -->
    <rect x="23" y="34" width="18" height="3.4" rx="1.7" fill="#3E4A63"/>
    <circle cx="32" cy="35.7" r="1.5" fill="url(#gold)"/>
  </g>

  <!-- 蝶：呼应两张立绘里的蝴蝶 -->
  <g transform="translate(46 14) rotate(18)">
    <path d="M0 0c-3.2-3.6-7-2.4-6.4 1.2C-6 4.2-2.6 5.4 0 3.4" fill="url(#gold)" opacity="0.9"/>
    <path d="M0 0c3.2-3.6 7-2.4 6.4 1.2C6 4.2 2.6 5.4 0 3.4" fill="url(#gold)" opacity="0.9"/>
  </g>
</svg>
